<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countup Multi-Device Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .status-box { display: flex; justify-content: space-around; font-size: 1.2rem; margin-bottom: 20px; background: #2a2a2a; padding: 10px; border-radius: 6px; }
    .player-card { flex: 1; margin: 5px; padding: 10px; border-radius: 6px; border: 2px solid transparent; }
    .active-player { border-color: #00e676; background: #26382b; }
    .button-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
    button { background: #333; color: #fff; border: 1px solid #555; padding: 15px; font-size: 1.1rem; border-radius: 4px; cursor: pointer; }
    button:hover { background: #444; }
    button:active { background: #666; }
    .btn-action { background: #d32f2f; }
    .btn-action:hover { background: #f44336; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Countup Multi-Device Tracker</h2>

    <div class="status-box">
      <div id="p1-card" class="player-card">
        <h3>Player 1</h3>
        <p>Score: <span id="p1-score">0</span></p>
      </div>
      <div id="p2-card" class="player-card">
        <h3>Player 2</h3>
        <p>Score: <span id="p2-score">0</span></p>
      </div>
    </div>

    <div>
      <p>Current Turn: <strong>Player <span id="current-player-display">1</span></strong></p>
      <p>Round: <span id="current-round-display">1</span> | Dart: <span id="current-dart-display">1</span></p>
    </div>

    <div class="button-grid" id="input-board">
      <button data-value="1">1</button>
      <button data-value="5">5</button>
      <button data-value="10">10</button>
      <button data-value="20">20</button>
      <button data-value="25">25 (Bull)</button>
      <button data-value="50">50 (D-Bull)</button>
      <button data-value="0">0 (Miss)</button>
      <button id="btn-next-player" class="btn-action">Next Player</button>
      <button id="btn-reset" class="btn-action" style="grid-column: span 4;">Reset Game</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://countupmultivice-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    const roomId = "9597"; 
    const gameStateRef = ref(db, `${roomId}/state`);

    const p1ScoreEl = document.getElementById("p1-score");
    const p2ScoreEl = document.getElementById("p2-score");
    const p1Card = document.getElementById("p1-card");
    const p2Card = document.getElementById("p2-card");
    const currentPlayerDisplay = document.getElementById("current-player-display");
    const currentRoundDisplay = document.getElementById("current-round-display");
    const currentDartDisplay = document.getElementById("current-dart-display");
    const inputBoard = document.getElementById("input-board");

    let localState = {};

    // Listen for Realtime DB updates
    onValue(gameStateRef, (snapshot) => {
      const state = snapshot.val();
      if (!state) {
        initGameState();
        return;
      }

      localState = state;

      // Extract scores safely
      const p1Score = state.dartScores && state.dartScores["1"] ? state.dartScores["1"] : 0;
      const p2Score = state.dartScores && state.dartScores["2"] ? state.dartScores["2"] : 0;

      p1ScoreEl.textContent = p1Score;
      p2ScoreEl.textContent = p2Score;
      currentPlayerDisplay.textContent = state.currentPlayer || 1;
      currentRoundDisplay.textContent = state.currentRound || 1;
      currentDartDisplay.textContent = state.currentDart || 1;

      // UI highlighting
      if (String(state.currentPlayer) === "2") {
        p2Card.classList.add("active-player");
        p1Card.classList.remove("active-player");
      } else {
        p1Card.classList.add("active-player");
        p2Card.classList.remove("active-player");
      }
    });

    function initGameState() {
      set(gameStateRef, {
        boardType: "basic",
        currentDart: 1,
        currentPlayer: 1,
        currentRound: 1,
        dartScores: { "1": 0, "2": 0 },
        gameOver: false,
        gameStarted: true
      });
    }

    // Dynamic Event Delegation for Input Buttons
    inputBoard.addEventListener("click", (e) => {
      if (!e.target.matches("button")) return;

      if (e.target.id === "btn-reset") {
        initGameState();
        return;
      }

      if (e.target.id === "btn-next-player") {
        switchPlayer();
        return;
      }

      const scoreVal = parseInt(e.target.dataset.value);
      if (isNaN(scoreVal)) return;

      recordScoreInput(scoreVal);
    });

    function recordScoreInput(value) {
      // Always pull dynamic current active player ("1" or "2")
      const activePlayer = String(localState.currentPlayer || 1);
      const currentScores = localState.dartScores || { "1": 0, "2": 0 };
      
      const newScore = (currentScores[activePlayer] || 0) + value;
      let newDart = (localState.currentDart || 1) + 1;
      let nextPlayer = parseInt(activePlayer);
      let nextRound = localState.currentRound || 1;

      // Handle turn progression after 3 darts
      if (newDart > 3) {
        newDart = 1;
        if (activePlayer === "1") {
          nextPlayer = 2;
        } else {
          nextPlayer = 1;
          nextRound += 1;
        }
      }

      // Explicit targeted write to Firebase path for active player
      update(gameStateRef, {
        [`dartScores/${activePlayer}`]: newScore,
        currentDart: newDart,
        currentPlayer: nextPlayer,
        currentRound: nextRound
      });
    }

    function switchPlayer() {
      const nextPlayer = String(localState.currentPlayer) === "1" ? 2 : 1;
      update(gameStateRef, {
        currentPlayer: nextPlayer,
        currentDart: 1
      });
    }
  </script>
</body>
</html>
